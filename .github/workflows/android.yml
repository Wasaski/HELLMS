name: Build HELLMS Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          target: android-33
          ndk-version: '25.2.9520075'

      - name: Install build tools
        run: |
          sdkmanager --install "build-tools;33.0.0" "platform-tools" "platforms;android-33"
          echo "SDK ready"

      - name: Install OpenGL dev packages
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libgl1-mesa-dev libglx-dev

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_BUILD_TYPE=Release

      - name: Compile native binary
        run: cmake --build build --target hellms -j4

      - name: Copy binary to Android project
        run: mkdir -p android/app/src/main/jniLibs/armeabi-v7a && cp build/hellms android/app/src/main/jniLibs/armeabi-v7a/hellms

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug -Pandroid.gradle.parallel=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk