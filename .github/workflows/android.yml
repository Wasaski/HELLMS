name: Build HELLMS Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: platform-tools

      - name: Accept Android licenses
        run: |
          # Accept licenses silently
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/ 2>/dev/null || true
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradlew') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build with Gradle (with explicit path)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --rerun-tasks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-apk
          path: app/build/outputs/apk/debug/app-debug.apk