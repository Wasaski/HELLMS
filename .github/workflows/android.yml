name: Build HELLMS Android CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: CMake Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cmake and g++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          cmake --version

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          echo "CMake configure complete"

      - name: Build
        run: |
          cmake --build build --target hellms -j4
          echo "Build complete"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-binary
          path: /HELLMS/build/hellms