name: Build HELLMS Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify build directory exists
        run: |
          ls /HELLMS/build/hellms 2>/dev/null || echo "Build dir check"

      - name: Run basic test
        run: |
          echo "Workflow is running on ubuntu-latest"
          python -c "print('Python works')"