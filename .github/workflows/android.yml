name: Build HELLMS Android Native Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: CMake Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
          cmake --version
          g++ --version

      - name: Configure CMake
        run: |
          rm -rf build
          cmake -B build -S . -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_BUILD_TYPE=Release
          echo "CMake configure complete"

      - name: Build native binary
        run: |
          cmake --build build --target hellms -j4
          echo "Build complete"

      - name: Verify binary
        run: |
          ls -la build/hellms
          ./build/hellms

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-binary
          path: build/hellms