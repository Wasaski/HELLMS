name: Build HELLMS Android CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: CMake Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: platform-tools

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/ 2>/dev/null || true
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install cmake
        run: |
          cmake --version

      - name: Configure CMake for Android
        run: |
          cmake -B build -S .
          cmake --build build --target hellms -j4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-binary
          path: /HELLMS/build/hellms