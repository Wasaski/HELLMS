name: Build HELLMS Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages (platform, build-tools, NDK, CMake)
        run: |
          # The runner ships a preinstalled SDK; setup-android@v3 breaks on it
          # because it still calls `sdkmanager tools`, which no longer exists.
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK and native libraries
        run: |
          mkdir -p artifacts/native-libs
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/hellms-debug.apk
          for so in $(find android/app/build/intermediates -name 'libhellms.so'); do
            abi=$(basename "$(dirname "$so")")
            cp "$so" "artifacts/native-libs/libhellms-$abi.so"
          done
          ls -lh artifacts artifacts/native-libs

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: hellms-native-libs
          path: artifacts/native-libs/*.so
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hellms-apk
          path: artifacts/hellms-debug.apk
          if-no-files-found: error
          retention-days: 30
