name: Build HELLMS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libgl1-mesa-dev libglx-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: cmake --build build --target hellms -j4

      - name: Test
        run: ./build/hellms

      - uses: actions/upload-artifact@v4
        with:
          name: hellms-binary
          path: build/hellms