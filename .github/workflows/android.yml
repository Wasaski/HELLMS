name: Build HELLMS Android Native Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: CMake Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          g++ --version

      - name: Build native binary
        run: |
          # Get all C++ source files
          CXX_FILES=$(find . -name '*.cpp' -not -path './.git/*' -not -path './build/*')
          
          # Compile all source files
          g++ -std=c++20 $CXX_FILES -o build/hellms -I.
          
          # Verify binary
          ls -la build/hellms
          ./build/hellms

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-binary
          path: /HELLMS/build/hellms
