name: Build HELLMS Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O /tmp/sdk-tools.zip
          mkdir -p /opt/android-sdk/cmdline-tools
          unzip -q /tmp/sdk-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo 'export ANDROID_SDK_ROOT=/opt/android-sdk' >> $GITHUB_ENV
          echo 'export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH' >> $GITHUB_ENV
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses 2>&1 || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Install OpenGL dev packages
        run: sudo apt-get install -y cmake g++ make libgl1-mesa-dev libglx-dev

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_BUILD_TYPE=Release

      - name: Compile native binary
        run: cmake --build build --target hellms -j4

      - name: Copy binary to Android project
        run: mkdir -p android/app/src/main/jniLibs/armeabi-v7a && cp build/hellms android/app/src/main/jniLibs/armeabi-v7a/hellms

      - name: Build APK with Gradle
        working-directory: android
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk