name: Build HELLMS Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -c "import sys; print(sys.version)"

      - name: Build APK with CMake (native)
        run: |
          cmake --build build --target hellms --config Release
          echo "Build completed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellms-binary
          path: /data/data/com.termux/files/home/HELLMS/build/hellms