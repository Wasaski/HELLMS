plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hellms.game'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.hellms.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1"

        ndk {
            // ABIs built by the NDK; libhellms.so lands in jniLibs automatically
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }
}
